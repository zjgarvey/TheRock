name: Runtime transition

on:
  workflow_dispatch:
    inputs:
      plan:
        type: choice
        description: Measured corpus selection (both selections build the complete distribution)
        options: [bringup, full]
        default: bringup
      publish:
        type: boolean
        description: Publish bounded issue candidates from the default branch after environment approval
        default: false
      runtime_ref:
        type: string
        description: Exact rocm-systems commit shared by both providers
        default: e38b188430ea50e7fd735364700b09a429115dd3

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-transition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configuration:
    # No PR event can reach the dedicated machines. Feature runs require an
    # approved exact worker commit; changing the branch alone does not approve it.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.sha == vars.RUNTIME_TRANSITION_WORKER_SHA)
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.configuration.outputs.image }}
      labels: ${{ steps.configuration.outputs.labels }}
      gpu: ${{ steps.configuration.outputs.gpu }}
      family: ${{ steps.configuration.outputs.family }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate explicit capacity and immutable container
        id: configuration
        env:
          TRANSITION_IMAGE: ${{ vars.RUNTIME_TRANSITION_IMAGE }}
          TRANSITION_RUNNER_LABELS: ${{ vars.RUNTIME_TRANSITION_RUNNER_LABELS }}
          TRANSITION_GPU: ${{ vars.RUNTIME_TRANSITION_GPU }}
          TRANSITION_GPU_FAMILY: ${{ vars.RUNTIME_TRANSITION_GPU_FAMILY }}
        run: python3 build_tools/runtime_transition.py workflow-configuration

  compare:
    outputs:
      report-sha256: ${{ steps.publication.outputs.sha256 }}
    needs: configuration
    runs-on: ${{ fromJSON(needs.configuration.outputs.labels) }}
    # Configure this environment to restrict trusted branches and require approval.
    environment: runtime-transition
    timeout-minutes: 4320
    env:
      TRANSITION_IMAGE: ${{ needs.configuration.outputs.image }}
      TRANSITION_GPU: ${{ needs.configuration.outputs.gpu }}
      TRANSITION_GPU_FAMILY: ${{ needs.configuration.outputs.family }}
      TRANSITION_PLAN: ${{ inputs.plan }}
      TRANSITION_REPOSITORY: ${{ github.repository }}
      TRANSITION_SHA: ${{ github.sha }}
      TRANSITION_RUNTIME_REF: ${{ inputs.runtime_ref }}
      TRANSITION_WORK: ${{ github.workspace }}/../../runtime-transition-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify this run's evidence job
        id: job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 build_tools/runtime_transition.py job-evidence
      - name: Build and measure both providers in an isolated container
        env:
          TRANSITION_EVIDENCE_URL: ${{ steps.job.outputs.url }}
        run: >-
          python3 build_tools/runtime_transition.py container
          --work-dir "${TRANSITION_WORK}"
          --therock-repository "${TRANSITION_REPOSITORY}"
          --therock-ref "${TRANSITION_SHA}"
          --runtime-ref "${TRANSITION_RUNTIME_REF}"
          --container-image "${TRANSITION_IMAGE}"
          --gpu "${TRANSITION_GPU}" --gpu-family "${TRANSITION_GPU_FAMILY}"
          --plan "build_tools/runtime_transition/${TRANSITION_PLAN}.json"
          --evidence-url "${TRANSITION_EVIDENCE_URL}"
      - name: Finalize incomplete runs and generate offline issue candidates
        if: always()
        run: >-
          python3 build_tools/runtime_transition.py finish
          --work-dir "${TRANSITION_WORK}"
          --therock-repository "${TRANSITION_REPOSITORY}"
          --therock-ref "${TRANSITION_SHA}"
          --runtime-ref "${TRANSITION_RUNTIME_REF}"
          --container-image "${TRANSITION_IMAGE}"
          --gpu "${TRANSITION_GPU}" --gpu-family "${TRANSITION_GPU_FAMILY}"
          --plan "build_tools/runtime_transition/${TRANSITION_PLAN}.json"
      - name: Upload structured evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-transition-evidence
          path: ${{ env.TRANSITION_WORK }}/reports/
          if-no-files-found: error
          retention-days: 30
      # Complete diagnostics are retained on the dedicated runner. Its disk and
      # access policy must keep logs/source paths out of public issue text.
      - name: Bind report evidence to the uploaded artifact
        id: publication
        if: always() && steps.evidence.outcome == 'success'
        env:
          TRANSITION_EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: >-
          python3 build_tools/runtime_transition.py prepare-publication
          --work-dir "${TRANSITION_WORK}" --evidence-url "${TRANSITION_EVIDENCE_URL}"
      - name: Upload publication input with immutable evidence links
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-transition-publication-input
          path: ${{ env.TRANSITION_WORK }}/reports/report.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: compare
    if: >-
      always() && inputs.publish &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: runtime-transition-publication
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: runtime-transition-issue-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-transition-publication-input
          path: transition
      - name: Publish bounded, structured candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_REPOSITORY: ${{ vars.RUNTIME_TRANSITION_ISSUE_REPOSITORY }}
          EXPECTED_REPORT_SHA256: ${{ needs.compare.outputs.report-sha256 }}
        run: >-
          python3 build_tools/runtime_transition.py publish-report
          --report transition/report.json --expected-sha256 "${EXPECTED_REPORT_SHA256}"
          --issue-repository "${ISSUE_REPOSITORY}"
