# Install this small dispatcher on the default branch to reach a trusted worker
# branch. Recurrence is opt-in: see docs/development/runtime_transition.md.
name: Runtime transition dispatcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    concurrency:
      group: runtime-transition-dispatcher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned worker branch and request a full measured run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSITION_WORKER_REF: ${{ vars.RUNTIME_TRANSITION_WORKER_REF }}
          TRANSITION_WORKER_SHA: ${{ vars.RUNTIME_TRANSITION_WORKER_SHA }}
          TRANSITION_RUNTIME_REF: ${{ vars.RUNTIME_TRANSITION_RUNTIME_REF }}
        run: python3 build_tools/runtime_transition.py dispatch
