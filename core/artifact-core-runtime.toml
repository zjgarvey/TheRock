# ROCR-Runtime
[components.lib."core/ROCR-Runtime/stage"]
[components.run."core/ROCR-Runtime/stage"]
[components.dbg."core/ROCR-Runtime/stage"]
[components.dev."core/ROCR-Runtime/stage"]
[components.doc."core/ROCR-Runtime/stage"]

# rocminfo
[components.run."core/rocminfo/stage"]
[components.dbg."core/rocminfo/stage"]
[components.doc."core/rocminfo/stage"]

# hrx
[components.lib."core/hrx/stage"]
optional = true
[components.run."core/hrx/stage"]
optional = true
include = [
  "lib/hrx/bin/**",
]
[components.dbg."core/hrx/stage"]
optional = true
[components.dev."core/hrx/stage"]
optional = true
include = [
  "lib/hrx/include/**",
  "lib/hrx/lib/cmake/**",
]
[components.doc."core/hrx/stage"]
optional = true
[components.test."core/hrx/stage"]
optional = true
include = [
  "lib/hrx/share/hrx-cts/**",
]

# Optional runtime development payload.
[components.lib."core/rocm-runtimes/stage"]
optional = true
include = ["lib/rocm-runtimes/lib/*.so*"]
[components.dev."core/rocm-runtimes/stage"]
optional = true
include = ["lib/rocm-runtimes/lib/*.a", "lib/rocm-runtimes/lib/*.rsp", "lib/rocm-runtimes/include/**"]
[components.doc."core/rocm-runtimes/stage"]
optional = true
include = ["lib/rocm-runtimes/share/doc/**"]
